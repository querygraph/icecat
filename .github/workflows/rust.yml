name: Rust rewrite

on:
  push:
    branches: [main]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-and-python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install tested Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - name: Format and test native crates
        run: |
          cargo fmt --all --check
          cargo test --locked
          cargo test --locked -p icebug-algorithms --features parallel
          cargo clippy --locked -p icebug-core -p icebug-algorithms -p icebug-io --all-targets -- -D warnings
      - name: Build and install Python wheel
        run: |
          python -m pip install maturin pytest numpy pyarrow
          maturin build --locked --out wheelhouse
          python -m pip install --no-index --find-links wheelhouse icebug-rust
      - name: Test installed Python API
        run: |
          python -m pytest compat-tests -q
          python tools/check_test_names.py ../networkit/test compat-tests
  query:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install tested Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy
      - name: Test optional DataFusion integration
        run: |
          cargo test --locked -p icebug-datafusion
          cargo clippy --locked -p icebug-datafusion --all-targets -- -D warnings
