[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["crates/grustcat", "crates/grustcat-cypher"]
default-members = ["crates/icebug-core", "crates/icebug-algorithms", "crates/icebug-io"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
arrow-array = "59.3.0"
arrow-buffer = "59.3.0"
arrow-schema = "59.3.0"
arrow-select = "59.3.0"
arrow-ipc = "59.3.0"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
proptest = "1"
rayon = "1.11"
icebug-core = { path = "crates/icebug-core", version = "0.1.0" }
icebug-algorithms = { path = "crates/icebug-algorithms", version = "0.1.0" }
icebug-io = { path = "crates/icebug-io", version = "0.1.0" }
datafusion = { version = "55.1.0", default-features = false, features = ["sql", "parquet"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
pyo3 = "0.29"
pyo3-arrow = { version = "0.19", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
